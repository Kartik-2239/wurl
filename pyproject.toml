[project]
name = "wurl-cli"
version = "0.2.0"
description = "wurl is a command-line HTTP client for making requests, it comes with Rich syntax highlighting and formatting."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Kartik-2239" }
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "term-image>=0.7.2",
    "yattag>=1.16.1",
]

[project.scripts]
wurl = "wurl.main:main"

[tool.hatch.build.targets.wheel]
packages = ["wurl"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
